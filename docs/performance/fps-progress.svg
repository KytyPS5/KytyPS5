    <text x="88" y="162.6" text-anchor="end">30</text>
    <line x1="100" y1="110.0" x2="1250" y2="110.0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="88" y="114.0" text-anchor="end">35</text>
    <text x="40" y="280" text-anchor="middle" transform="rotate(-90 40 280)" font-size="14" fill="#475569">fps</text>
  </g>
  <!-- Pipelines on workers* -->
