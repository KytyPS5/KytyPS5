[package]
name = "kyty-launcher"
version = "0.1.0"
description = "Alternative launcher for the Kyty PS5 emulator"
edition = "2021"

[lib]
name = "kyty_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
regex = "1.12"
reqwest = { version = "0.12", features = ["blocking", "json"] }
dirs = "5"
gilrs = { version = "0.11.2", features = ["serde"] }
tokio = { version = "1", features = ["time", "rt"] }
futures-util = "0.3"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }
# Bluetooth has no cross-platform backend: every portable Rust crate is
# BLE-only, and the devices this panel targets (DualSense pads, headsets)
# pair over Bluetooth Classic instead. So each OS gets its native stack --
# BlueZ here, WinRT below, IOBluetooth on macOS. See bluetooth.rs.
bluer = { version = "0.17.4", features = ["bluetoothd"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString"] }
objc2-io-bluetooth = { version = "0.3", features = [
    "IOBluetoothDevice",
    "IOBluetoothDevicePair",
    "IOBluetoothHostController",
    "Bluetooth",
    "IOBluetoothDeviceInquiry",
] }
# CoreAudio device enumeration for audio.rs -- see that file's doc comment.
coreaudio-rs = "0.14"
