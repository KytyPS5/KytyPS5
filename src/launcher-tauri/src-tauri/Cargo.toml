[package]
name = "kyty-launcher"
version = "0.1.0"
description = "Alternative launcher for the Kyty PS5 emulator"
edition = "2021"

[lib]
name = "kyty_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
regex = "1.12"
reqwest = { version = "0.12", features = ["blocking", "json"] }
dirs = "5"
gilrs = { version = "0.11.2", features = ["serde"] }
bluer = { version = "0.17.4", features = ["bluetoothd"] }
tokio = { version = "1", features = ["time"] }
futures-util = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }

[dev-dependencies]
tempfile = "3"
