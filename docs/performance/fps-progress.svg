  <rect x="100" y="512" width="16" height="12" rx="2" fill="#94a3b8"/><text x="124" y="523" font-size="13" fill="#475569">without the part</text>
  <rect x="270" y="512" width="16" height="12" rx="2" fill="#2563eb"/><text x="294" y="523" font-size="13" fill="#475569">with the part</text>
  <rect x="420" y="512" width="16" height="12" rx="2" fill="#bfdbfe" stroke="#2563eb"/><text x="444" y="523" font-size="13" fill="#475569">the measured range</text>
  <text x="100" y="556" font-size="12" fill="#64748b">The pairs come from different scenes, routes and render sizes, so compare a bar only with its pair. * The game renders at 4K in these pairs.</text>
  <text x="100" y="576" font-size="12" fill="#64748b">With every part, the level runs at about 28 fps (28.7 fps on the one-minute route), and at 27–34 fps through nine minutes of play. "Idle images, 2 MiB buffers": after six minutes.</text>
