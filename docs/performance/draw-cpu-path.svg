<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">The CPU path of one draw</text>
  <text x="600" y="72" text-anchor="middle" font-size="15" fill="#475569">Red: work repeated on each draw. Green: done once, or off the GPU thread.</text>

  <text x="300" y="116" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">In the draw</text>
  <text x="900" y="116" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">KytyPS5</text>
  <line x1="600" y1="96" x2="600" y2="680" stroke="#e2e8f0" stroke-width="2"/>

  <g font-size="14">
    <!-- in the draw -->
    <rect x="80" y="136" width="440" height="56" rx="8" fill="#e2e8f0"/>
    <text x="300" y="169" text-anchor="middle" fill="#0f172a">Draw packet from the guest</text>
    <line x1="300" y1="192" x2="300" y2="214" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="80" y="216" width="440" height="72" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
    <text x="300" y="244" text-anchor="middle" font-weight="700" fill="#7f1d1d">SRT walker</text>
    <text x="300" y="266" text-anchor="middle" fill="#7f1d1d">interprets the shader's resource reads</text>
    <line x1="300" y1="288" x2="300" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="80" y="312" width="440" height="72" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
    <text x="300" y="340" text-anchor="middle" font-weight="700" fill="#7f1d1d">Decode each texture descriptor</text>
    <text x="300" y="362" text-anchor="middle" fill="#7f1d1d">again, even when it did not change</text>
    <line x1="300" y1="384" x2="300" y2="406" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="80" y="408" width="440" height="72" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
    <text x="300" y="436" text-anchor="middle" font-weight="700" fill="#7f1d1d">Copy changed guest memory</text>
    <text x="300" y="458" text-anchor="middle" fill="#7f1d1d">to staging, one range after the other</text>
    <line x1="300" y1="480" x2="300" y2="502" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="80" y="504" width="440" height="72" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
    <text x="300" y="532" text-anchor="middle" font-weight="700" fill="#7f1d1d">Get the pipeline</text>
    <text x="300" y="554" text-anchor="middle" fill="#7f1d1d">translate and build it now if it is new</text>
    <line x1="300" y1="576" x2="300" y2="598" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="80" y="600" width="440" height="56" rx="8" fill="#e2e8f0"/>
    <text x="300" y="633" text-anchor="middle" fill="#0f172a">Record the draw</text>

    <!-- KytyPS5 -->
    <rect x="680" y="136" width="440" height="56" rx="8" fill="#e2e8f0"/>
    <text x="900" y="169" text-anchor="middle" fill="#0f172a">Draw packet from the guest</text>
    <line x1="900" y1="192" x2="900" y2="214" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="680" y="216" width="440" height="72" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
    <text x="900" y="240" text-anchor="middle" font-weight="700" fill="#14532d">SRT tape</text>
    <text x="900" y="260" text-anchor="middle" fill="#14532d">a flat list of steps: 6.76 → 2.90 ms per frame</text>
    <text x="900" y="279" text-anchor="middle" font-size="12" fill="#475569">plans with control flow use the walker</text>
    <line x1="900" y1="288" x2="900" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="680" y="312" width="440" height="72" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
    <text x="900" y="340" text-anchor="middle" font-weight="700" fill="#14532d">Decoded descriptor, remembered</text>
    <text x="900" y="362" text-anchor="middle" fill="#14532d">per shader resource: 4.10 → 3.38 ms per frame</text>
    <line x1="900" y1="384" x2="900" y2="406" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="680" y="408" width="440" height="72" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
    <text x="900" y="436" text-anchor="middle" font-weight="700" fill="#14532d">Copy workers fill staging</text>
    <text x="900" y="458" text-anchor="middle" fill="#14532d">the ranges of a batch copy in parallel: 27 → 30.5 fps</text>
    <line x1="900" y1="480" x2="900" y2="502" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="680" y="504" width="440" height="72" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
    <text x="900" y="532" text-anchor="middle" font-weight="700" fill="#14532d">Get the pipeline</text>
    <text x="900" y="554" text-anchor="middle" fill="#14532d">built ahead, or left out while a worker builds it</text>
    <line x1="900" y1="576" x2="900" y2="598" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="680" y="600" width="440" height="56" rx="8" fill="#e2e8f0"/>
    <text x="900" y="633" text-anchor="middle" fill="#0f172a">Record the draw</text>

  </g>
</svg>
