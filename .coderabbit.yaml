# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Keep inherited review profiles, automatic reviews, tools, and pre-merge checks.
inheritance: true

reviews:
  # Trim supplemental output and keep the remaining walkthrough collapsed.
  high_level_summary: false
  review_status: false
  review_details: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: false

  # Hide standard finishing-touch controls; this also disables their commands.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

chat:
  art: false
